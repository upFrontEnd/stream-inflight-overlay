name: Update overlay screenshot

on:
  push:
    branches:
      - main
    paths-ignore:
      - "img/overlay.png"

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx --bun playwright install --with-deps chromium

      - name: Build overlay
        run: bun run build

      - name: Start preview server
        run: |
          bunx --bun vite preview --host 127.0.0.1 --port 4173 &
          echo $! > /tmp/vite-preview.pid

      - name: Wait for preview server
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Capture overlay
        run: bun run capture:overlay

      - name: Commit updated screenshot
        run: |
          git config user.name "UpFrontEnd"
          git config user.email "adelkamelermont@gmail.com"

          git add img/overlay.png

          if git diff --cached --quiet; then
            echo "Screenshot unchanged"
            exit 0
          fi

          git commit -m "Update overlay screenshot"
          git push
