<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Flight Overlay</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="CSS/style.css"
  >

  <script
    src="js/overlay.js"
    defer
  ></script>
</head>

<body>

  <div class="viewport">

    <main class="overlay">


      <!-- =================================================
           BACKGROUND
      ================================================== -->

      <div class="top-rail"></div>
      <div class="cyan-line"></div>
      <div class="lower-rail"></div>


      <!-- =================================================
           CALLSIGN
      ================================================== -->

      <div class="info-group info-group--callsign">

        <div class="info-tag info-tag--callsign">

          <svg
            class="item-icon item-icon--callsign"
            viewBox="0 0 32 28"
            aria-hidden="true"
          >

            <g class="headset-icon">

              <path d="M7 16v-3a9 9 0 0 1 18 0v3"/>

              <path
                d="
                  M7 15
                  H5.5
                  A2.5 2.5 0 0 0 3 17.5
                  V20
                  A2.5 2.5 0 0 0 5.5 22.5
                  H8
                  V15
                  Z
                "
              />

              <path
                d="
                  M25 15
                  H26.5
                  A2.5 2.5 0 0 1 29 17.5
                  V20
                  A2.5 2.5 0 0 1 26.5 22.5
                  H24
                  V15
                  Z
                "
              />

            </g>

            <path
              class="headset-spark headset-spark--left"
              d="M2 7 L5 8 L3.5 11"
            />

            <path
              class="headset-spark headset-spark--right"
              d="M30 7 L27 8 L28.5 11"
            />

            <path
              class="headset-spark headset-spark--top"
              d="M16 1 L17 4 L15 5"
            />

          </svg>

          <span class="info-label">
            CALLSIGN
          </span>

        </div>


        <div class="info-data">

          <span
            id="callsign"
            class="info-value"
          >
            AFR006
          </span>

        </div>

      </div>


      <!-- =================================================
           NETWORK
      ================================================== -->

      <div class="info-group info-group--network">

        <div class="info-tag info-tag--network">

          <svg
            class="item-icon item-icon--network"
            viewBox="0 0 28 28"
            aria-hidden="true"
          >

            <path
              class="wifi-wave wifi-wave--3"
              d="M3 10.5 Q14 1 25 10.5"
            />

            <path
              class="wifi-wave wifi-wave--2"
              d="M7 15 Q14 9 21 15"
            />

            <path
              class="wifi-wave wifi-wave--1"
              d="M11 19 Q14 16.5 17 19"
            />

            <circle
              class="wifi-dot"
              cx="14"
              cy="23"
              r="1.8"
            />

          </svg>

          <span class="info-label">
            NETWORK
          </span>

        </div>


        <div class="info-data">

          <span
            id="network"
            class="info-value"
          >
            VATSIM
          </span>

        </div>

      </div>


      <!-- =================================================
           PHASE
      ================================================== -->

      <div
        class="info-group info-group--phase"
        data-flight-phase="CRUISE"
      >

        <div class="info-data info-data--right">

          <span
            id="flight-phase"
            class="info-value"
          >
            CRUISE
          </span>

        </div>


        <div class="info-tag info-tag--phase">

          <svg
            class="item-icon item-icon--phase"
            viewBox="0 0 32 32"
            aria-hidden="true"
          >

            <circle
              class="phase-dial"
              cx="16"
              cy="16"
              r="12.5"
            />


            <g class="phase-horizon-group">

              <path
                class="phase-horizon-line"
                d="M6.5 16 H25.5"
              />

              <path
                class="phase-horizon-mark phase-horizon-mark--left"
                d="M8.5 12.5 H12"
              />

              <path
                class="phase-horizon-mark phase-horizon-mark--right"
                d="M20 12.5 H23.5"
              />

              <path
                class="phase-horizon-mark phase-horizon-mark--left"
                d="M10 20 H13"
              />

              <path
                class="phase-horizon-mark phase-horizon-mark--right"
                d="M19 20 H22"
              />

            </g>


            <g class="phase-aircraft-reference">

              <path
                d="
                  M7.5 16
                  H12.5
                  L14.2 18
                  H17.8
                  L19.5 16
                  H24.5
                "
              />

              <path
                d="M16 18 V20.5"
              />

            </g>


            <circle
              class="phase-center-dot"
              cx="16"
              cy="16"
              r="1.25"
            />

          </svg>


          <span class="info-label">
            PHASE
          </span>

        </div>

      </div>


      <!-- =================================================
           AIRCRAFT
      ================================================== -->

      <div class="info-group info-group--aircraft">

        <div class="info-data info-data--right">

          <span
            id="aircraft"
            class="info-value"
          >
            A320neo
          </span>

        </div>


        <div class="info-tag info-tag--aircraft">

          <svg
            class="item-icon item-icon--aircraft"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              class="aircraft-animation-shape"
              d="
                M12 2
                C11 2 10.5 4.2 10.5 7.2
                V9.3
                L3 13.8
                V16
                L10.5 13.7
                V18.7
                L8 21
                V22
                L12 21
                L16 22
                V21
                L13.5 18.7
                V13.7
                L21 16
                V13.8
                L13.5 9.3
                V7.2
                C13.5 4.2 13 2 12 2
                Z
              "
            />

          </svg>


          <span class="info-label">
            AIRCRAFT
          </span>

        </div>

      </div>


      <!-- =================================================
           LAST FOLLOWER
      ================================================== -->

      <div class="social-strip social-strip--left">

        <div class="social-tag social-tag--follower">

          <svg
            class="social-icon social-icon--follower"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <circle
              class="follower-ring"
              cx="12"
              cy="12"
              r="9"
            />

            <g class="follower-plus">

              <path d="M12 7v10"/>
              <path d="M7 12h10"/>

            </g>

          </svg>


          <span class="social-label">
            LAST FOLLOW
          </span>

        </div>


        <div class="social-data social-data--left">

          <span
            id="latest-follower"
            class="social-value"
          >
            AeroMax92
          </span>

        </div>

      </div>


      <!-- =================================================
           LATEST SUB
      ================================================== -->

      <div class="social-strip social-strip--right">

        <div class="social-data social-data--right">

          <span
            id="latest-sub"
            class="social-value"
          >
            CaptainLeo
          </span>

        </div>


        <div class="social-tag social-tag--subscriber">

          <span class="social-label">
            LATEST SUB
          </span>


          <svg
            class="social-icon social-icon--subscriber"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <circle
              class="subscriber-ring"
              cx="12"
              cy="12"
              r="9"
            />

            <path
              class="subscriber-check"
              d="M7.5 12 L10.5 15 L16.5 8"
            />

          </svg>

        </div>

      </div>


      <!-- =================================================
           DEPARTURE
      ================================================== -->

      <div
        class="airport airport--departure"
        data-airport="departure"
      >

        <div class="airport-face"></div>


        <div class="airport-content">

          <img
            id="departure-flag"
            class="airport-flag"
            data-country="FR"
            src="https://flagcdn.com/fr.svg"
            alt="Drapeau France"
          >


          <div class="airport-text">

            <span class="airport-label">
              DEP
            </span>

            <span
              id="departure-code"
              class="airport-code"
              data-icao="LFPG"
            >
              LFPG
            </span>

          </div>

        </div>

      </div>


      <!-- =================================================
           ARRIVAL
      ================================================== -->

      <div
        class="airport airport--arrival"
        data-airport="arrival"
      >

        <div class="airport-face"></div>


        <div class="airport-content">

          <div class="airport-text">

            <span class="airport-label">
              ARR
            </span>

            <span
              id="arrival-code"
              class="airport-code"
              data-icao="KJFK"
            >
              KJFK
            </span>

          </div>


          <img
            id="arrival-flag"
            class="airport-flag"
            data-country="US"
            src="https://flagcdn.com/us.svg"
            alt="Drapeau États-Unis"
          >

        </div>

      </div>


      <!-- =================================================
           CENTER MODULE
      ================================================== -->

      <div class="center-module">

        <svg
          class="center-face"
          viewBox="0 0 276 110"
          aria-hidden="true"
        >

          <defs>

            <linearGradient
              id="centerGradient"
              x1="0"
              y1="0"
              x2="0"
              y2="110"
            >

              <stop
                offset="0"
                stop-color="#284663"
              />

              <stop
                offset="1"
                stop-color="#0c2643"
              />

            </linearGradient>

          </defs>


          <circle
            cx="138"
            cy="-32"
            r="136"
            fill="url(#centerGradient)"
            stroke="#dedfe0"
            stroke-width="3.5"
          />

        </svg>


        <svg
          class="progress"
          viewBox="0 0 276 110"
          aria-hidden="true"
        >

          <path
            class="progress-track"
            d="M61 34 Q80 17 111 10"
          />

          <path
            class="progress-track"
            d="M165 10 Q196 17 215 34"
          />

          <path
            class="progress-value"
            data-progress-left
            pathLength="100"
            d="M61 34 Q80 17 111 10"
          />

          <path
            class="progress-value"
            data-progress-right
            pathLength="100"
            d="M165 10 Q196 17 215 34"
          />

          <circle
            class="progress-endpoint progress-endpoint--left"
            cx="61"
            cy="34"
            r="4"
          />

          <circle
            class="progress-endpoint progress-endpoint--right"
            cx="215"
            cy="34"
            r="4"
          />

        </svg>


        <div class="progress-percent">

          <strong data-progress-text>
            63
          </strong>

          <span>
            %
          </span>

        </div>


        <img
          src="img/logo.min.svg"
          alt=""
          class="center-logo"
        >

      </div>


    </main>

  </div>

</body>

</html>
